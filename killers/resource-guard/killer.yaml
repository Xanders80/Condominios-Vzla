name: "resource-guard"
version: "1.0.0"

trigger_conditions:
  - token_usage_exceeds_threshold
  - execution_time_degradation
  - memory_usage_spike
  - api_cost_threshold_approaching

thresholds:
  max_tokens_per_task: 8000
  max_tokens_per_session: 50000
  max_execution_time: 300
  max_api_cost_per_session: 5.00
  max_memory_usage_mb: 512

actions:
  1_monitor:
    - track_token_usage
    - track_execution_time
    - track_api_costs

  2_warn:
    - condition: "token_usage > 70% of max"
      action: "warn_user_and_suggest_optimization"
    - condition: "execution_time > 60% of max"
      action: "suggest_task_breakdown"

  3_throttle:
    - condition: "token_usage > 85% of max"
      action: "switch_to_smaller_model"
    - condition: "execution_time > 85% of max"
      action: "reduce_max_tokens"

  4_terminate:
    - condition: "token_usage > 100% of max"
      action: "terminate_and_save_state"
    - condition: "cost_exceeds_limit"
      action: "terminate_and_notify"

escalation:
  notify: "tech-lead"
  preserve_context: true
  suggest_alternatives: true
