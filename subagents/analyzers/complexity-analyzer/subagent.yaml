name: "complexity-analyzer"
parent_agent: "tech-lead"
task_scope: "code_analysis"
max_execution_time: 60
max_tokens: 3000

inputs:
  - file_path
  - analysis_type (cyclomatic, cognitive, maintainability)

outputs:
  - complexity_report
  - refactoring_suggestions

validation:
  - report_format_valid
  - suggestions_actionable
